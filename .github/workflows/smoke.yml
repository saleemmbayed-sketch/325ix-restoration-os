name: Source and 3D interface contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source parse, offline viewer contract
        run: python3 test_viewer3d_contract.py
      - name: Original mechanical GLB and three-checkpoint contracts
        run: python3 test_rc19_mechanical.py
      - name: Report limits
        run: echo 'Full catalog/device/WebGL acceptance requires privately held derived data and installed 3D assets. This job does not certify release readiness.'
