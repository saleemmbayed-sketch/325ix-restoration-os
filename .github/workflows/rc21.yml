name: RC21 isolated demo and V4 integration

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc21-regression:
    name: RC21 regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned 3D runtime kit
        run: python3 scripts/prepare_3d_assets.py

      - name: Run isolated synthetic demo
        run: python3 test_local_demo.py

      - name: Run visual-to-workflow handoff
        run: python3 test_front_play_visual_handoff.py

      - name: Run V4 read-only integrity checks
        run: python3 test_v4_runtime_integrity.py

      - name: Run catalog path and viewer contracts
        run: |
          python3 test_runtime_catalog_paths.py
          python3 test_viewer3d_contract.py
          python3 test_rc19_mechanical.py

      - name: Browser journey with local 3D and saved case
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/ixdeps --ignore-scripts --no-save --no-audit --no-fund playwright@1.57.0
          /tmp/ixdeps/node_modules/.bin/playwright install chromium
          python3 scripts/run_local_demo.py --port 8877 --no-browser --state-dir /tmp/ix-ci-demo &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8877/api/3d/status >/dev/null; then break; fi
            sleep 0.2
          done
          CI_CAPTURE_DIR=/tmp/ix-ci-captures NODE_PATH=/tmp/ixdeps/node_modules WORKBENCH_URL=http://127.0.0.1:8877 node scripts/browser_local_demo_smoke.cjs

      - name: Save browser journey screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc21-browser-journey
          path: /tmp/ix-ci-captures/*.png
          if-no-files-found: ignore
          retention-days: 7
